# Phase 8.2 — FCM kill-push BACKSTOP (v0.9.8).
#
# Primary tier: the sandbox mini-service (kill-push-service) polls Firestore
# every 5 s and is the tier that actually meets a request's 2-minute answer
# window. THIS workflow is the backstop that keeps the push flowing while
# that sandbox is recycled or rebuilt.
#
# Reality of GitHub schedules: they are best-effort and can be delayed by
# several minutes under load — so a run often lands after a specific ask's
# deadline. That is safe by design: scripts/fcm-kill-push.mjs only pushes
# FRESH asks (deadline still in the future) and is fully idempotent
# (killPushSentAt mark + dead-token cleanup), so a late run does nothing
# rather than confusing anyone with a push for an expired request.
#
# Note: GitHub disables scheduled workflows after 60 days of repository
# inactivity — the repo is actively developed, but keep it in mind.
#
# 2026-10-29 observed reality: after landing on main (04:03 UTC) the schedule
# fired only ONCE (10:50 UTC) and then went silent for hours — the known
# GitHub "scheduled workflow runs sporadically" behavior. Touching this file
# (this comment) re-registers the schedule. This tier is a best-effort
# backstop only; PERMANENT every-minute coverage is the Cloudflare Worker
# tier (cloudflare/killpush-worker.js + wrangler.toml cron trigger).
#
# 2026-10-31 (M9): manual dispatch run 41203101630 SUCCESS (0-error sweep);
# the 3 earlier schedule failures (17:57 / 22:13 / 01:39 UTC) were Firestore
# 429 free-quota, self-healing after the daily 07:00 UTC reset (logs verified
# in M7). Touching this comment re-registers the schedule again.
name: kill-push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: kill-push
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kill-push sweep
        run: node scripts/fcm-kill-push.mjs
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
