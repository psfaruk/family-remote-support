# Phase 8.2 — FCM kill-push BACKSTOP (v0.9.8).
#
# ⛔ POSTURE CHANGE (2026-10-31, post-M10 Owner quota directive): the schedule
# is DISABLED — no automatic Firestore polling from any server tier. The Owner
# ordered: read/write only when the user acts; requests only from the app; zero
# requests from the sandbox. The auto tiers (sandbox 5 s poll — observed
# running as TWO instances ≈ 69k read attempts/day — the Worker's every-minute
# cron and this 5-min backstop) together far exceeded the 50,000/day free read
# quota → the recurring evening RESOURCE_EXHAUSTED errors. This workflow stays
# manually dispatchable (Actions → kill-push → Run workflow) for on-demand /
# diagnostic sweeps only.
#
# RE-ARM (if dead-app ask alerts are ever wanted again): uncomment the
# `schedule:` block below and push — the 5-min backstop resumes (and see
# wrangler.toml to re-arm the Worker's every-minute cron).
#
# History (pre-park): the sandbox mini-service was the tier that met a
# request's 2-minute answer window; this workflow backstopped it while the
# sandbox was recycled. GitHub schedules are best-effort (2026-10-29: fired
# once then went silent for hours; touching the file re-registers it). The
# sweep only pushes FRESH asks and is fully idempotent (killPushSentAt mark +
# dead-token cleanup). 2026-10-31 (M9): manual dispatch run 41203101630
# SUCCESS; the 3 earlier schedule failures were Firestore 429 free-quota,
# self-healing after the daily 07:00 UTC reset.
name: kill-push

on:
  # ⛔ Quota directive 2026-10-31 — schedule disabled (see header). Re-arm:
  # # schedule:
  # #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: kill-push
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kill-push sweep
        run: node scripts/fcm-kill-push.mjs
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
